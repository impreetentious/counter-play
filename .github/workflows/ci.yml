name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      # Scoped to production dependencies: the shipped static export must stay
      # advisory-free, while dev-only tooling advisories do not block. This step
      # consults the live advisory database, so it can turn red without any commit
      # changing — that is intended, and the fix is a dependency bump, not a revert.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:version
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm run lint
      # Every §3.x citation in source must resolve in docs/MATH-SPEC.md.
      - run: npm run check:citations
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      # After the build so it can scan the real export, not just the configs.
      - run: npm run check:csp
      - run: npm run test:e2e
