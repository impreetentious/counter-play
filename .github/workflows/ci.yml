name: Verify

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the checkout, it never writes back.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      # This consults the live advisory database and covers build/test tooling as well as runtime code.
      - run: npm audit --audit-level=high
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:all
